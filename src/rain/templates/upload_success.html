<div class="bg-green-50 border border-green-200 rounded-lg p-4">
    <div class="flex items-start">
        <div class="flex-shrink-0">
            <svg class="h-5 w-5 text-green-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" />
            </svg>
        </div>
        <div class="ml-3 flex-1">
            <h3 class="text-sm font-medium text-green-800">SBOM Uploaded Successfully!</h3>
            <div class="mt-2 text-sm text-green-700">
                <p><strong>Name:</strong> {{ sbom.name }}</p>
                <p><strong>Format:</strong> {{ sbom.format }} {{ sbom.spec_version }}</p>
                <p><strong>Components:</strong> {{ sbom.component_count }}</p>
                {% if sbom.vulnerability_count > 0 %}
                <p class="text-red-600"><strong>Vulnerabilities:</strong> {{ sbom.vulnerability_count }}</p>
                {% endif %}
            </div>
            <div class="mt-4">
                <button
                    hx-get="/api/sboms-html"
                    hx-target="#sbom-list"
                    class="text-sm font-medium text-green-800 hover:text-green-900"
                >
                    Refresh list to see it →
                </button>
            </div>
        </div>
    </div>
</div>
