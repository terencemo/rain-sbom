{% extends "base.html" %}

{% block title %}RAIN SBOM - Upload & Analyze{% endblock %}

{% block content %}
<div class="max-w-6xl mx-auto" x-data="rainApp()">

    <!-- Upload Section -->
    <div class="bg-white rounded-lg shadow-md p-6 mb-8">
        <h2 class="text-xl font-bold text-gray-800 mb-4">📤 Upload SBOM</h2>

        <form
            hx-post="/api/sboms"
            hx-encoding="multipart/form-data"
            hx-target="#upload-result"
            hx-indicator="#upload-spinner"
            class="space-y-4"
        >
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    Custom Name (optional)
                </label>
                <input
                    type="text"
                    name="name"
                    placeholder="e.g., Production v1.2.3"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                >
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    SBOM File (JSON)
                </label>
                <input
                    type="file"
                    name="file"
                    accept=".json"
                    required
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100"
                >
            </div>

            <div class="flex items-center space-x-4">
                <button
                    type="submit"
                    class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition flex items-center space-x-2"
                >
                    <span>Upload & Parse</span>
                    <span id="upload-spinner" class="htmx-indicator">
                        <svg class="animate-spin h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                    </span>
                </button>
            </div>
        </form>

        <!-- Upload Result -->
        <div id="upload-result" class="mt-4"></div>
    </div>

    <!-- SBOM List -->
    <div class="bg-white rounded-lg shadow-md p-6">
        <div class="flex items-center justify-between mb-4">
            <h2 class="text-xl font-bold text-gray-800">📦 Stored SBOMs</h2>
            <button
                hx-get="/api/sboms-html"
                hx-target="#sbom-list"
                hx-indicator="#list-spinner"
                class="text-blue-600 hover:text-blue-700 flex items-center space-x-2"
            >
                <span>Refresh</span>
                <span id="list-spinner" class="htmx-indicator">
                    <svg class="animate-spin h-4 w-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                </span>
            </button>
        </div>

        <div
            id="sbom-list"
            hx-get="/api/sboms-html"
            hx-trigger="load"
            hx-indicator="#list-spinner"
        >
            <div class="text-center py-8 text-gray-500">
                <svg class="animate-spin h-8 w-8 mx-auto mb-2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                Loading...
            </div>
        </div>
    </div>
</div>

<script>
    function rainApp() {
        return {
            // Alpine.js data/methods can go here if needed
        }
    }
</script>
{% endblock %}
